services:
  eq2advanced:
    image: ghcr.io/improvmasta/eq2advanced:main
    container_name: eq2advanced
    restart: unless-stopped
    ports:
      - "8450:8450"
    environment:
      DATA_DIR: /data
      PORT: "8450"
      HOST: 0.0.0.0
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_INSTALL_URL: ${DISCORD_INSTALL_URL:-}
    volumes:
      - ${APPDATA_PATH}/eq2advanced/data:/data
