name: Build and push public GHCR image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PACKAGE_NAME: eq2advanced

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          response=$(curl -sS -w "\n%{http_code}" -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${PACKAGE_NAME}/visibility" \
            -d '{"visibility":"public"}')
          status=$(printf "%s" "$response" | tail -n 1)
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "GHCR package visibility set to public."
          else
            echo "GitHub did not accept the package visibility API call (HTTP $status)."
            echo "If the package is private, make it public once at:"
            echo "https://github.com/users/improvmasta/packages/container/package/eq2advanced/settings"
          fi
